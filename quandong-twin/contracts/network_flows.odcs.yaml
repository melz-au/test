# ODCS v3.2.0 data contract — single source of truth for the `network_flows` feed.
# Generated code (TypeScript types, JSON Schema, Spark schemas, pipeline expectations) derives from this file:
# edit here, then run `npm run gen`.
apiVersion: v3.2.0
kind: DataContract
id: quandong-mfw-network-flows
name: network_flows
version: 1.0.0
status: active
domain: ot-security-monitoring
tenant: quandong-cyber
dataProduct: murray-flats-water-ot-twin
description:
  purpose: "Aggregated network connections observed on the site OT network and the head-office link."
  usage: Landed as newline-delimited JSON by the Cloudflare generator; ingested by the Lakeflow pipeline (bronze_network_flows -> silver_network_flows).
  limitations: Entirely synthetic. Murray Flats Water, its sites, assets, users and vendors are fictional.
tags: [synthetic, ot-security, murray-flats-water]
customProperties:
  - property: grain
    value: "One row per connection (source, destination, destination port, protocol) per one-minute window."
  - property: landingFolder
    value: network_flows
schema:
  - name: network_flows
    physicalName: network_flows
    physicalType: ndjson
    logicalType: object
    description: "Aggregated network connections observed on the site OT network and the head-office link."
    properties:
      - name: event_id
        logicalType: string
        physicalType: STRING
        logicalTypeOptions:
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        required: true
        primaryKey: true
        unique: true
        description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2,6}$"
        description: Quandong customer code. MFW = Murray Flats Water (fictional).
      - name: site_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)$"
        description: Pump station (PS01 to PS40) or HO for head office.
      - name: feed
        logicalType: string
        physicalType: STRING
        required: true
        description: Name of the feed this event belongs to.
      - name: schema_version
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: Semantic version of the contract the event was produced against.
      - name: generator_run_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Identifier of the generator deployment (seed and configuration) that produced the event.
      - name: window_start
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: "Start of the one-minute aggregation window (UTC, inclusive)."
      - name: window_end
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: "End of the one-minute aggregation window (UTC, exclusive)."
      - name: src_asset_id
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Source asset, or null when the source is not in the inventory (for example a remote access gateway client)."
      - name: dst_asset_id
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Destination asset, or null when not in the inventory."
      - name: src_ip
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "Source IPv4 address."
      - name: dst_ip
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "Destination IPv4 address."
      - name: dst_port
        logicalType: integer
        physicalType: INT
        required: true
        logicalTypeOptions:
          minimum: 1
          maximum: 65535
        description: "Destination Transmission Control Protocol (TCP) or User Datagram Protocol (UDP) port."
      - name: transport
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: tcp
          - value: udp
        description: "Transport protocol."
      - name: protocol
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: "Modbus/TCP"
          - value: DNP3
          - value: "OPC UA"
          - value: HTTPS
          - value: SSH
          - value: RDP
          - value: OTHER
        description: "Application protocol identified by the sensor. OTHER when it could not be identified (for example a bare connection attempt)."
      - name: bytes
        logicalType: integer
        physicalType: BIGINT
        required: true
        logicalTypeOptions:
          minimum: 0
        description: "Bytes transferred in both directions during the window."
      - name: packets
        logicalType: integer
        physicalType: BIGINT
        required: true
        logicalTypeOptions:
          minimum: 0
        description: "Packets transferred in both directions during the window."
      - name: direction
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: internal
          - value: inbound
          - value: outbound
        description: "Direction relative to the site OT network."
      - name: connection_state
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: established
          - value: rejected
          - value: syn_only
        description: "Outcome of the connection: established, rejected (reset or refused), or syn_only (no reply)."
    quality:
      - id: window_is_one_minute
        type: custom
        engine: databricks-expectation
        implementation: "window_end = window_start + INTERVAL 1 MINUTE"
        severity: error
        dimension: conformity
        description: "Flows are aggregated in one-minute windows."
      - id: established_has_packets
        type: custom
        engine: databricks-expectation
        implementation: "connection_state <> 'established' OR packets > 0"
        severity: warning
        dimension: accuracy
        description: "An established connection should carry at least one packet."
