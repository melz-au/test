# ODCS v3.2.0 data contract — single source of truth for the `remote_access` feed.
# Generated code (TypeScript types, JSON Schema, Spark schemas, pipeline expectations) derives from this file:
# edit here, then run `npm run gen`.
apiVersion: v3.2.0
kind: DataContract
id: quandong-mfw-remote-access
name: remote_access
version: 1.0.0
status: active
domain: ot-security-monitoring
tenant: quandong-cyber
dataProduct: murray-flats-water-ot-twin
description:
  purpose: "Remote access sessions brokered by the Murray Flats Water remote access gateway."
  usage: Landed as newline-delimited JSON by the Cloudflare generator; ingested by the Lakeflow pipeline (bronze_remote_access -> silver_remote_access).
  limitations: Entirely synthetic. Murray Flats Water, its sites, assets, users and vendors are fictional.
tags: [synthetic, ot-security, murray-flats-water]
customProperties:
  - property: grain
    value: "One row per remote access session state change: rejected (authentication failed), started, ended. A session therefore has one row (rejected) or two (started, ended)."
  - property: landingFolder
    value: remote_access
schema:
  - name: remote_access
    physicalName: remote_access
    physicalType: ndjson
    logicalType: object
    description: "Remote access sessions brokered by the Murray Flats Water remote access gateway."
    properties:
      - name: event_id
        logicalType: string
        physicalType: STRING
        logicalTypeOptions:
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        required: true
        primaryKey: true
        unique: true
        description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2,6}$"
        description: Quandong customer code. MFW = Murray Flats Water (fictional).
      - name: site_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)$"
        description: Pump station (PS01 to PS40) or HO for head office.
      - name: feed
        logicalType: string
        physicalType: STRING
        required: true
        description: Name of the feed this event belongs to.
      - name: schema_version
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: Semantic version of the contract the event was produced against.
      - name: generator_run_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Identifier of the generator deployment (seed and configuration) that produced the event.
      - name: session_id
        logicalType: string
        physicalType: STRING
        required: true
        description: "Gateway session identifier."
      - name: session_state
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: rejected
          - value: started
          - value: ended
        description: "Lifecycle state this row records."
      - name: username
        logicalType: string
        physicalType: STRING
        required: true
        description: "User name (fictional). Named username, not user, because Spark SQL resolves a bare user as the current-user function."
      - name: user_type
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: employee
          - value: vendor
        description: "Employee or third-party vendor."
      - name: source_ip
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "Public IPv4 address the user connected from (documentation ranges only)."
      - name: source_country
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2}$"
        description: "Two-letter ISO 3166-1 country code from geolocation of source_ip."
      - name: mfa_method
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: push
          - value: totp
          - value: none
        description: "Multi-factor authentication (MFA) method used."
      - name: mfa_result
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: accepted
          - value: denied
          - value: timeout
          - value: not_required
        description: "Outcome of the MFA challenge."
      - name: start_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: "When the session (or attempt) started (UTC)."
      - name: end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: false
        description: "When the session ended (UTC). Null unless session_state = ended."
      - name: target_asset_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Asset the session connects to."
      - name: protocol
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: RDP
          - value: SSH
          - value: HTTPS
        description: "Remote access protocol."
    quality:
      - id: end_after_start
        type: custom
        engine: databricks-expectation
        implementation: "end_ts IS NULL OR end_ts >= start_ts"
        severity: error
        dimension: consistency
        description: "A session cannot end before it starts."
      - id: ended_has_end_ts
        type: custom
        engine: databricks-expectation
        implementation: "session_state <> 'ended' OR end_ts IS NOT NULL"
        severity: error
        dimension: completeness
        description: "An ended session carries its end time."
      - id: started_was_accepted
        type: custom
        engine: databricks-expectation
        implementation: "session_state = 'rejected' OR mfa_result IN ('accepted', 'not_required')"
        severity: warning
        dimension: consistency
        description: "Only accepted authentications start sessions."
