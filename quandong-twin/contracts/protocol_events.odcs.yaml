# ODCS v3.2.0 data contract — single source of truth for the `protocol_events` feed.
# Generated code (TypeScript types, JSON Schema, Spark schemas, pipeline expectations) derives from this file:
# edit here, then run `npm run gen`.
apiVersion: v3.2.0
kind: DataContract
id: quandong-mfw-protocol-events
name: protocol_events
version: 1.0.0
status: active
domain: ot-security-monitoring
tenant: quandong-cyber
dataProduct: murray-flats-water-ot-twin
description:
  purpose: "Industrial protocol commands (Modbus/TCP, DNP3, OPC UA) decoded by the sensor."
  usage: Landed as newline-delimited JSON by the Cloudflare generator; ingested by the Lakeflow pipeline (bronze_protocol_events -> silver_protocol_events).
  limitations: Entirely synthetic. Murray Flats Water, its sites, assets, users and vendors are fictional.
tags: [synthetic, ot-security, murray-flats-water]
customProperties:
  - property: grain
    value: "One row per industrial protocol command. Routine read polls are aggregated per minute per initiator, target and function code (command_count > 1)."
  - property: landingFolder
    value: protocol_events
schema:
  - name: protocol_events
    physicalName: protocol_events
    physicalType: ndjson
    logicalType: object
    description: "Industrial protocol commands (Modbus/TCP, DNP3, OPC UA) decoded by the sensor."
    properties:
      - name: event_id
        logicalType: string
        physicalType: STRING
        logicalTypeOptions:
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        required: true
        primaryKey: true
        unique: true
        description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2,6}$"
        description: Quandong customer code. MFW = Murray Flats Water (fictional).
      - name: site_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)$"
        description: Pump station (PS01 to PS40) or HO for head office.
      - name: feed
        logicalType: string
        physicalType: STRING
        required: true
        description: Name of the feed this event belongs to.
      - name: schema_version
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: Semantic version of the contract the event was produced against.
      - name: generator_run_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Identifier of the generator deployment (seed and configuration) that produced the event.
      - name: asset_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Target asset that received the command."
      - name: initiator_asset_id
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Asset that sent the command, or null when the sender is not in the inventory."
      - name: initiator_ip
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "IPv4 address that sent the command."
      - name: protocol
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: "Modbus/TCP"
          - value: DNP3
          - value: "OPC UA"
        description: "Industrial protocol."
      - name: function_code
        logicalType: integer
        physicalType: INT
        required: true
        logicalTypeOptions:
          minimum: 0
          maximum: 255
        description: "Protocol function code (for example Modbus 3 = read holding registers, 6 = write single register, 90 = vendor programming function)."
      - name: operation
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: read
          - value: write
          - value: program_download
          - value: firmware_update
        description: "Normalised operation."
      - name: register_or_point
        logicalType: string
        physicalType: STRING
        required: false
        description: "Register, point or tag addressed, e.g. 40021 (CL2.SETPOINT_MGL). Null for program and firmware operations."
      - name: old_value
        logicalType: number
        physicalType: DOUBLE
        required: false
        description: "Value before a write, when known."
      - name: new_value
        logicalType: number
        physicalType: DOUBLE
        required: false
        description: "Value written, when the operation is a write."
      - name: user_context
        logicalType: string
        physicalType: STRING
        required: false
        description: "User or application context reported by the initiator (for example an HMI operator login), when available."
      - name: command_count
        logicalType: integer
        physicalType: INT
        required: true
        logicalTypeOptions:
          minimum: 1
        description: "Number of identical commands aggregated into this row (1 for writes and programming)."
      - name: result
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: success
          - value: failure
        description: "Whether the target accepted the command."
      - name: logic_checksum_before
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^[0-9a-f]{8}$"
        description: "Logic checksum before a program download."
      - name: logic_checksum_after
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^[0-9a-f]{8}$"
        description: "Logic checksum after a program download."
      - name: firmware_version
        logicalType: string
        physicalType: STRING
        required: false
        description: "Firmware version reported by the target at the time of the command."
    quality:
      - id: write_has_new_value
        type: custom
        engine: databricks-expectation
        implementation: "operation <> 'write' OR new_value IS NOT NULL"
        severity: error
        dimension: completeness
        description: "A write must carry the value written."
      - id: cl2_setpoint_write_in_band
        type: custom
        engine: databricks-expectation
        implementation: "NOT (operation = 'write' AND register_or_point LIKE '%CL2.SETPOINT_MGL%') OR new_value BETWEEN 0.5 AND 1.5"
        severity: warning
        dimension: accuracy
        description: "Chlorine dosing setpoint writes should stay within the 0.5-1.5 mg/L operating band. Breaches can be attacks, so rows are kept."
      - id: cl2_setpoint_write_physical
        type: custom
        engine: databricks-expectation
        implementation: "NOT (operation = 'write' AND register_or_point LIKE '%CL2.SETPOINT_MGL%') OR new_value BETWEEN 0 AND 5"
        severity: warning
        dimension: accuracy
        description: "Chlorine dosing setpoint writes should be within the instrument range 0-5 mg/L."
