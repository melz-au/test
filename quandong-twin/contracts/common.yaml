# Common envelope carried by every Quandong twin event.
# Every feed contract repeats these properties verbatim (ODCS has no include mechanism);
# `npm run contracts:check` fails if any contract drifts from this file.
properties:
  - name: event_id
    logicalType: string
    physicalType: STRING
    logicalTypeOptions:
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    required: true
    primaryKey: true
    unique: true
    description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: true
    logicalTypeOptions:
      pattern: "^[A-Z]{2,6}$"
    description: Quandong customer code. MFW = Murray Flats Water (fictional).
  - name: site_id
    logicalType: string
    physicalType: STRING
    required: true
    logicalTypeOptions:
      pattern: "^(PS[0-9]{2}|HO)$"
    description: Pump station (PS01 to PS40) or HO for head office.
  - name: feed
    logicalType: string
    physicalType: STRING
    required: true
    description: Name of the feed this event belongs to.
  - name: schema_version
    logicalType: string
    physicalType: STRING
    required: true
    logicalTypeOptions:
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: Semantic version of the contract the event was produced against.
  - name: generator_run_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Identifier of the generator deployment (seed and configuration) that produced the event.
