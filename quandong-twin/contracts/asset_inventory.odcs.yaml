# ODCS v3.2.0 data contract — single source of truth for the `asset_inventory` feed.
# Generated code (TypeScript types, JSON Schema, Spark schemas, pipeline expectations) derives from this file:
# edit here, then run `npm run gen`.
apiVersion: v3.2.0
kind: DataContract
id: quandong-mfw-asset-inventory
name: asset_inventory
version: 1.0.0
status: active
domain: ot-security-monitoring
tenant: quandong-cyber
dataProduct: murray-flats-water-ot-twin
description:
  purpose: "Inventory of operational technology (OT) assets observed by the Quandong sensor at each site."
  usage: Landed as newline-delimited JSON by the Cloudflare generator; ingested by the Lakeflow pipeline (bronze_asset_inventory -> silver_asset_inventory).
  limitations: Entirely synthetic. Murray Flats Water, its sites, assets, users and vendors are fictional.
tags: [synthetic, ot-security, murray-flats-water]
customProperties:
  - property: grain
    value: "One row per asset per snapshot. A full snapshot is emitted when a site starts and daily at 00:05 local time; single-asset rows are emitted when an asset is added, modified or removed."
  - property: landingFolder
    value: asset_inventory
schema:
  - name: asset_inventory
    physicalName: asset_inventory
    physicalType: ndjson
    logicalType: object
    description: "Inventory of operational technology (OT) assets observed by the Quandong sensor at each site."
    properties:
      - name: event_id
        logicalType: string
        physicalType: STRING
        logicalTypeOptions:
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        required: true
        primaryKey: true
        unique: true
        description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2,6}$"
        description: Quandong customer code. MFW = Murray Flats Water (fictional).
      - name: site_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)$"
        description: Pump station (PS01 to PS40) or HO for head office.
      - name: feed
        logicalType: string
        physicalType: STRING
        required: true
        description: Name of the feed this event belongs to.
      - name: schema_version
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: Semantic version of the contract the event was produced against.
      - name: generator_run_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Identifier of the generator deployment (seed and configuration) that produced the event.
      - name: asset_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Stable asset identifier, {site}-{type code}-{nn}, e.g. PS03-PLC-01."
      - name: asset_type
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: plc
            description: "Programmable logic controller"
          - value: rtu
            description: "Remote terminal unit"
          - value: hmi
            description: "Human-machine interface"
          - value: engineering_workstation
            description: "Engineering workstation used to program controllers"
          - value: network_switch
            description: "Managed network switch"
          - value: historian
            description: "Process historian"
          - value: scada_server
            description: "Supervisory control and data acquisition (SCADA) server"
          - value: unknown
            description: "Not classified by the sensor"
        description: "Kind of asset."
      - name: vendor
        logicalType: string
        physicalType: STRING
        required: true
        description: "Manufacturer (fictional). \"Unknown\" when the sensor cannot fingerprint the device."
      - name: model
        logicalType: string
        physicalType: STRING
        required: true
        description: "Model name (fictional)."
      - name: firmware_version
        logicalType: string
        physicalType: STRING
        required: false
        description: "Firmware version reported by the device, or null when unknown."
      - name: logic_checksum
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          pattern: "^[0-9a-f]{8}$"
        description: "Checksum (CRC-32, hex) of the control logic loaded on a programmable device; null for devices that do not hold logic."
      - name: ip_address
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "Private IPv4 address of the asset."
      - name: mac_address
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^([0-9a-f]{2}:){5}[0-9a-f]{2}$"
        description: "Media access control (MAC) address."
      - name: purdue_level
        logicalType: integer
        physicalType: INT
        required: true
        logicalTypeOptions:
          minimum: 0
          maximum: 5
        description: "Level in the Purdue reference model (0 = process, 1 = basic control, 2 = supervisory, 3 = site operations, 4-5 = enterprise)."
      - name: criticality
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: low
          - value: medium
          - value: high
          - value: critical
        description: "Business criticality of the asset."
      - name: first_seen
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: "When the sensor first observed the asset (UTC)."
      - name: last_seen
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: "When the sensor most recently observed the asset (UTC)."
      - name: change_type
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: snapshot
            description: "Part of a periodic full snapshot"
          - value: added
            description: "Asset seen for the first time"
          - value: modified
            description: "An attribute changed (for example firmware or logic checksum)"
          - value: removed
            description: "Asset no longer observed"
        description: "Why this row was emitted."
    quality:
      - id: last_seen_after_first_seen
        type: custom
        engine: databricks-expectation
        implementation: "last_seen >= first_seen"
        severity: error
        dimension: consistency
        description: "An asset cannot be last seen before it was first seen."
