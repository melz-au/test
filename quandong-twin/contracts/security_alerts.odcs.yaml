# ODCS v3.2.0 data contract — single source of truth for the `security_alerts` feed.
# Generated code (TypeScript types, JSON Schema, Spark schemas, pipeline expectations) derives from this file:
# edit here, then run `npm run gen`.
apiVersion: v3.2.0
kind: DataContract
id: quandong-mfw-security-alerts
name: security_alerts
version: 1.0.0
status: active
domain: ot-security-monitoring
tenant: quandong-cyber
dataProduct: murray-flats-water-ot-twin
description:
  purpose: "The OT sensor's own alerts. Includes background noise and under-rated alerts; Quandong detections in the lakehouse are independent of these."
  usage: Landed as newline-delimited JSON by the Cloudflare generator; ingested by the Lakeflow pipeline (bronze_security_alerts -> silver_security_alerts).
  limitations: Entirely synthetic. Murray Flats Water, its sites, assets, users and vendors are fictional.
tags: [synthetic, ot-security, murray-flats-water]
customProperties:
  - property: grain
    value: "One row per detection raised by the OT sensor."
  - property: landingFolder
    value: security_alerts
schema:
  - name: security_alerts
    physicalName: security_alerts
    physicalType: ndjson
    logicalType: object
    description: "The OT sensor's own alerts. Includes background noise and under-rated alerts; Quandong detections in the lakehouse are independent of these."
    properties:
      - name: event_id
        logicalType: string
        physicalType: STRING
        logicalTypeOptions:
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        required: true
        primaryKey: true
        unique: true
        description: Deterministic UUID (version 8, hash-derived) identifying the event. Used for deduplication.
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: When the event happened, Coordinated Universal Time (UTC), ISO 8601 with millisecond precision and a Z suffix.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[A-Z]{2,6}$"
        description: Quandong customer code. MFW = Murray Flats Water (fictional).
      - name: site_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)$"
        description: Pump station (PS01 to PS40) or HO for head office.
      - name: feed
        logicalType: string
        physicalType: STRING
        required: true
        description: Name of the feed this event belongs to.
      - name: schema_version
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: Semantic version of the contract the event was produced against.
      - name: generator_run_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Identifier of the generator deployment (seed and configuration) that produced the event.
      - name: alert_id
        logicalType: string
        physicalType: STRING
        required: true
        description: "Sensor alert identifier."
      - name: rule_id
        logicalType: string
        physicalType: STRING
        required: true
        description: "Sensor rule identifier."
      - name: rule_name
        logicalType: string
        physicalType: STRING
        required: true
        description: "Human-readable sensor rule name."
      - name: severity
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: low
          - value: medium
          - value: high
          - value: critical
        description: "Severity assigned by the sensor."
      - name: mitre_attack_ics_technique
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^T0[0-9]{3}$"
        description: "MITRE ATT&CK for Industrial Control Systems (ICS) technique ID, e.g. T0836."
      - name: asset_id
        logicalType: string
        physicalType: STRING
        required: true
        logicalTypeOptions:
          pattern: "^(PS[0-9]{2}|HO)-[A-Z]{2,4}-[0-9]{2}$"
        description: "Asset the alert relates to."
      - name: src_ip
        logicalType: string
        physicalType: STRING
        required: false
        logicalTypeOptions:
          format: ipv4
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: "Source IPv4 address involved, when relevant."
      - name: description
        logicalType: string
        physicalType: STRING
        required: true
        description: "Alert text."
      - name: status
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - value: new
          - value: acknowledged
          - value: closed
          - value: false_positive
        description: "Triage status at the time of export."
